<div class="form-field">
    <label>Images</label>
    <input type="file" id="id_image" name="images" accept="image/*" multiple hidden>

    <label for="id_image" class="upload-btn" id="imageUploadBtn">
        🖼 Choose Images
    </label>

    <div id="imageQueueContainer" style="margin-top: 10px;"></div>

    {% if note and note.images.exists %}
        <div class="existing-files" style="margin-top: 15px; border-top: 1px solid #ccc; padding-top: 10px;">
            <p style="font-size: 0.9em; color: #555;">Saved images:</p>
            {% for img_obj in note.images.all %}
            <div style="display: flex; flex-direction: column; margin-bottom: 12px; width: 100%; border-bottom: 1px dashed #ccc; padding-bottom: 8px;">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
                    <div style="display: flex; align-items: center; flex: 1; min-width: 0; gap: 10px;">
                        <img src="{{ img_obj.image.url }}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 4px; flex-shrink: 0;">
                        <span style="font-size: 0.9em; word-break: break-all; flex: 1; min-width: 0;">{{ img_obj.image.name }}</span>
                    </div>
                    <a href="{% url 'notes:delete_image' img_obj.id %}" class="remove-btn">🗑 Remove</a>
                </div>

                <input type="text"
                    name="caption_{{ img_obj.id }}"
                    value="{{ img_obj.caption }}"
                    placeholder="Изменить подпись под картинкой..."
                    style="margin-top: 5px; width: 100%; padding: 4px 8px; font-size: 0.9em; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            {% endfor %}

        </div>
    {% endif %}
</div>

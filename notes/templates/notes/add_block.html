{% extends "base.html" %}

{% block content %}

<div class="form-page">

    <div class="form-card">

        <h1>{{ title }}</h1>

        <form method="post" enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="form-actions">

                <button
                    type="submit"
                    class="primary-btn">

                    Save

                </button>

                <a
                    href="javascript:history.back()"
                    class="secondary-btn">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}

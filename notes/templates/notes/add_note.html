{% extends "base.html" %}

{% block content %}

<div class="form-page">

    <div class="form-card">

        <h1>Add Note</h1>

        <form method="post" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="form-field">

    <label for="{{ form.title.id_for_label }}">
        Title
    </label>

    {{ form.title }}

</div>

<div class="form-field">

                <label for="{{ form.reference_title.id_for_label }}">
                    Reference Title
                </label>

                {{ form.reference_title }}

            </div>

            <div class="form-field">

                <label for="{{ form.references.id_for_label }}">
                    Reference URL
                </label>

                {{ form.references }}

            </div>

    {% include "notes/_pdf_upload.html" %}
    {% include "notes/_image_upload.html" %}

<div class="form-field">

    <label for="{{ form.content.id_for_label }}">
        Content
    </label>

    {{ form.content }}

</div>

            <div class="form-actions">

                <button type="submit" class="primary-btn">

                    Save

                </button>

                <a href="{% if subject %}{% url 'topics:subject_detail' subject.id %}{% else %}{% url 'topics:section_detail' section.id %}{% endif %}"
                   class="secondary-btn">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% load static %}

<script src="{% static 'js/note_upload.js' %}"></script>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<div class="form-page">

    <div class="form-card">

        <h1>Delete Note</h1>

        <p>

            Are you sure you want to delete this note?

        </p>

        <div class="delete-preview">

            <strong>

                {{ note.title }}

            </strong>

        </div>

        <form method="post">

            {% csrf_token %}

            <div class="form-actions">

                <button
                    type="submit"
                    class="danger-btn">

                    Delete

                </button>

                <a
                    href="{% if note.subject %}{% url 'topics:subject_detail' note.subject.id %}{% else %}{% url 'topics:section_detail' note.section.id %}{% endif %}"
                    class="secondary-btn">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}

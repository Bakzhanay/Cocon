{% extends "base.html" %}

{% block content %}

<div class="form-page">

    <div class="form-card">

        <h1>Delete Section</h1>

        <p class="form-subtitle">

            Are you sure you want to delete
            <strong>{{ section.title }}</strong>?

        </p>

        <form method="post">

            {% csrf_token %}

            <div class="form-actions">

                <button
                    type="submit"
                    class="btn-danger-small">

                    Delete

                </button>

                <a
                    href="{% url 'topics:topic_detail' section.topic.id %}"
                    class="secondary-btn">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}

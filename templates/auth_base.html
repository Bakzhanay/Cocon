<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Cocon{% endblock %}</title>

    {% load static %}

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body class="auth-body">

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="auth-logo">

            Cocon &#129419;

        </div>

        {% block content %}
        {% endblock %}

    </div>

</div>

<script>

function togglePassword(id, icon){

    const input = document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";
        icon.textContent = "🙈";

    }else{

        input.type = "password";
        icon.textContent = "👁";

    }

}

</script>

</body>

</html>

{% extends "base.html" %}

{% block content %}

<div class="form-page">

    <div class="form-card">

        <h1>Delete Flashcard</h1>

        <p>

            Are you sure you want to delete this flashcard?

        </p>

        <div class="delete-preview">

            <strong>

                {{ flashcard.question }}

            </strong>

        </div>

        <form method="post">

            {% csrf_token %}

            <div class="form-actions">

                <button
                    type="submit"
                    class="danger-btn">

                    Delete

                </button>

                <a
                    href="{% if flashcard.subject %}{% url 'flashcards:subject_flashcards' flashcard.subject.id %}{% else %}{% url 'flashcards:section_flashcards' flashcard.section.id %}{% endif %}"
                    class="secondary-btn">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}

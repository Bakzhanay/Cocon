{% extends "base.html" %}

{% block content %}

<div class="form-page">

    <div class="form-card">

        <h1>Remove Image</h1>

        <p>

            Are you sure you want to remove this image?

        </p>

        <br>

        <img
            src="{{ flashcard.question_image.url }}"
            class="note-preview-image">

        <form method="post">

            {% csrf_token %}

            <div class="form-actions">

                <button
                    type="submit"
                    class="danger-btn">

                    Remove

                </button>

                <a
                    href="{% url 'flashcards:edit_flashcard' flashcard.id %}"
                    class="secondary-btn">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
